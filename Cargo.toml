[package]
name = "n7n-g"
version = "0.1.4"
edition = "2021"
description = "g — git-дельта CLI (getw/pull/push/ch): перенесення worktree-дельт з багаторівневим авторезолвом конфліктів"
license = "ISC"
repository = "https://git.7n.ai/7n/g"
readme = "README.md"

[[bin]]
name = "g"
path = "src/bin/g.rs"

[lib]
name = "n7n_g"
path = "src/lib.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/g-{ target }{ archive-suffix }"
pkg-fmt = "bin"

[dependencies]
clap = { version = "4", features = ["derive"] }
gix = "0.70"
# show_toplevel — спільний з n7n-llm-lib/n7n-harness тонкий gix-хелпер
# (`rev-parse --show-toplevel`), винесений звідти в окремий крейт саме щоб
# і `g` міг перевикористати замість власної копії (git.7n.ai/7n/llm-lib
# PR #5/#6). Git-залежність, не crates.io: `n7n-gix-util` там ще не
# опубліковано, а `g` сам не публікується на crates.io (лише бінарні
# релізи через Forgejo/binstall — `[package.metadata.binstall]` вище), тож
# правило crates.io "лише registry-залежності" тут не діє. Явний `package
# =` обов'язковий із ДВОХ причин: (1) без нього Cargo не вгадає, який саме
# крейт workspace-репозиторію `llm-lib` брати; (2) сам крейт має `[lib]
# name = "gix_util"`, а без перейменування ключем це колізувало б із
# локальним `pub mod gix_util` нижче в `src/lib.rs` — `package =` форсує
# експортоване ім'я саме в те, що зліва (`n7n_gix_util`), незалежно від
# `[lib].name` пакета.
n7n-gix-util = { git = "https://git.7n.ai/7n/llm-lib", rev = "3a33210009c5866181756fa81d87b108dc4b216c", package = "n7n-gix-util" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
# Автовідкат reverse-delta при Ctrl-C/SIGTERM (pull.rs) — крос-платформно
# (Windows Ctrl handler / Unix signal), на відміну від zsh `trap ... INT TERM`.
ctrlc = "3"
# Форматування created/modified worktree-метаданих у локальному часі (getw.rs) —
# крос-платформно, на відміну від shell-оригіналу (`date -r` / `stat -f`, macOS-BSD).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# ACP-агентний шар (Codex/Cursor/Pi) + local_cloud (local-openai) — див. ADR
# 20260814-195911: перевикористання наявного llm-lib замість написання
# LLM-частини з нуля. Опубліковано на crates.io під n7n-llm-lib (lib-ім'я
# лишається llm_lib) — той самий крейт, що й в екосистемі 7n-rules, versioned
# dependency замість git/path. 0.3: плоский Tier (без каскаду MIN→AVG→MAX),
# EgressPolicy на фасадах (cascade::one_shot_cascade), бюджет замість байтової
# стелі, ліза на локальну модель, Goose видалений — див. `acp_agents.rs`.
# `default-features = true` — фіча `agents` крейта потрібна: ACP і local_cloud
# під нею.
llm-lib = { version = "0.3", package = "n7n-llm-lib", optional = true, default-features = true }
# block_on навколо async one_shot_acp у синхронних Resolver/Generator-трейтах
# (acp_agents.rs) — сам llm-lib теж на tokio, окрема декларація потрібна для
# виклику Runtime у нашому крейті.
tokio = { version = "1", features = ["rt", "rt-multi-thread"], optional = true }
# Нативний TUI fuzzy-picker для `getw` (tui_picker.rs) — розкладка raw-mode/подій
# крос-платформно (Linux/macOS/Windows), на відміну від Unix-специфічного termios.
crossterm = "0.29"
# Fuzzy-matching рядків у пікері — той самий алгоритм, що в helix/telescope.nvim,
# активно підтримується (на відміну від застарілого fuzzy-matcher/skim); без
# залежності на весь `skim`-бінарник.
nucleo-matcher = "0.3"

[features]
default = ["agents"]
agents = ["dep:llm-lib", "dep:tokio"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
