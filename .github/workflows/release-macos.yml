name: Build g release assets

# The Forgejo fleet cannot build Apple targets because they require a real
# Apple SDK. This mirror contributes native macOS and Windows assets; Forgejo
# remains the single writer for the public artifact and Homebrew formula.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build macOS binaries
        run: |
          cargo build --release --locked --target aarch64-apple-darwin --bin g
          cargo build --release --locked --target x86_64-apple-darwin --bin g
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/g dist/g-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/g dist/g-x86_64-apple-darwin
      - name: Wait for the draft Forgejo release
        env:
          TOKEN: ${{ secrets.FJ_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            release_id="$(curl --fail --silent --show-error \
              --header "Authorization: token ${TOKEN}" \
              "https://git.7n.ai/api/v1/repos/7n/g/releases/tags/${TAG}" \
              | jq --raw-output '.id' || true)"
            if test -n "${release_id}" && test "${release_id}" != null; then
              echo "release_id=${release_id}" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 30
          done
          echo "draft Forgejo release did not appear" >&2
          exit 1
      - name: Upload macOS assets to the draft release
        env:
          TOKEN: ${{ secrets.FJ_TOKEN }}
        run: |
          set -euo pipefail
          for asset in g-aarch64-apple-darwin g-x86_64-apple-darwin; do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' --request POST \
              --header "Authorization: token ${TOKEN}" \
              --form "attachment=@dist/${asset}" \
              "https://git.7n.ai/api/v1/repos/7n/g/releases/${release_id}/assets?name=${asset}")"
            if test "${status}" = 409; then
              echo "release asset already exists: ${asset}"
            elif test "${status}" != 201; then
              cat "${response_file}" >&2
              exit 1
            fi
          done

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows binary
        shell: pwsh
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc --bin g
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/g.exe dist/g-x86_64-pc-windows-msvc.exe
      - name: Wait for the draft Forgejo release
        shell: pwsh
        env:
          TOKEN: ${{ secrets.FJ_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $headers = @{ Authorization = "token $env:TOKEN" }
          for ($attempt = 1; $attempt -le 40; $attempt++) {
            try {
              $release = Invoke-RestMethod -Headers $headers -Uri "https://git.7n.ai/api/v1/repos/7n/g/releases/tags/$env:TAG"
              if ($release.id) {
                "release_id=$($release.id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                exit 0
              }
            } catch {}
            Start-Sleep -Seconds 30
          }
          throw "draft Forgejo release did not appear"
      - name: Upload Windows asset to the draft release
        shell: pwsh
        env:
          TOKEN: ${{ secrets.FJ_TOKEN }}
        run: |
          $headers = @{ Authorization = "token $env:TOKEN" }
          $uri = "https://git.7n.ai/api/v1/repos/7n/g/releases/$env:release_id/assets?name=g-x86_64-pc-windows-msvc.exe"
          try {
            Invoke-RestMethod -Method Post -Headers $headers -Form @{ attachment = Get-Item 'dist/g-x86_64-pc-windows-msvc.exe' } -Uri $uri | Out-Null
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 409) { throw }
          }
