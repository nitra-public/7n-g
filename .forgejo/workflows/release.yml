name: Release g

# Патерн перенесено з mt-rust/.github/workflows/release-mt.yml (ADR 20260814-195911):
# build matrix → Forgejo Release (замість GitHub Release) → оновлення Homebrew tap
# 7n/homebrew. Прапор cargo-binstall pkg-url у Cargo.toml очікує саме такі asset-імена
# (g-<target>) — бінарник називається `g` (скорочено від git), package/crate — n7n-g.
#
# Linux+Windows кросскомпілюються на self-hosted Linux-раннері (двома різними
# інструментами залежно від таргету, matrix.builder):
# - zigbuild (musl): cargo-zigbuild + Zig несе власний мінімальний musl-сисрут.
# - xwin (Windows): cargo-xwin замість cargo-zigbuild — windows-gnu відкинуто
#   через upstream-баг у aws-lc-sys (vendored jitterentropy тягне POSIX-only
#   sched.h на будь-якому не-msvc таргеті, спостережено 2026-08-17). msvc-таргет
#   легально отримує офіційний MS SDK/CRT через xwin (Microsoft дозволяє це для
#   крос-компіляції, на відміну від Apple). Zig-емуляція clang-cl теж
#   відкинута (структурний баг: hardening-прапори Zig несумісні з cl-режимом) —
#   лінкуємо через довантажений СПРАВЖНІЙ LLVM-реліз.
#
# macOS (aarch64-apple-darwin) НЕ будується тут — немає macOS-раннера на
# git.7n.ai, а cargo-zigbuild впирається у aws-lc-sys, якому потрібен реальний
# Apple SDK (CoreServices.h), недоступний через Zig-заглушки. Замість цього
# macOS будується на GitHub Actions macos-14 (реальний Mac, нативно, без
# крос-компіляції) — окремий workflow nitra-public/7n-g:
# .github/workflows/release-macos.yml (mirror цього репо, sync_on_commit).
# Той GH workflow вивантажує macOS-асет у ЦЕЙ САМИЙ git.7n.ai-реліз і патчить
# лише секцію on_macos у Formula/g.rb (git.7n.ai/7n/homebrew) — не чіпаючи
# on_linux, який пише цей workflow. Обидва пайплайни ідемпотентні щодо
# порядку виконання (кожен створює skeleton-файл, якщо відсутній, і патчить
# лише свою секцію за BEGIN/END-маркерами).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    # git.7n.ai: "ubuntu-latest" мапиться на непослідовний fleet self-hosted-образів,
    # частина з яких бракує базових утиліт (curl/apt/sudo/xz/python3 залежно від
    # конкретного варіанту, спостережено 2026-08-16). "tauri" — окремий, повноцінно
    # оснащений runner (Tauri-збірки вимагають повний C-тулчейн) — пробуємо його.
    runs-on: tauri
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: g-x86_64-unknown-linux-musl
            bin_name: g
            builder: zigbuild
          # windows-gnu відкинуто: aws-lc-sys (crypto rustls) несе vendored
          # jitterentropy-library, чий build.rs вирішує "компілювати чи ні" за
          # target_env замість target_os — на gnu безумовно тягне POSIX-only
          # <sched.h>, якого немає в MinGW ("fatal error: 'sched.h' file not
          # found", спостережено 2026-08-17; той самий баг вилазить і на
          # реальному Windows з GNU/MinGW-тулчейном, це не наслідок Zig-кросу).
          # На msvc-таргеті aws-lc-sys вважає себе не-POSIX і пропускає
          # jitterentropy — баг просто не спрацьовує. cargo-xwin легально тягне
          # офіційний MS SDK/CRT (на відміну від Apple SDK — MS дозволяє це для
          # крос-компіляції, звідси й існування xwin/cargo-xwin).
          - target: x86_64-pc-windows-msvc
            asset: g-x86_64-pc-windows-msvc.exe
            bin_name: g.exe
            builder: xwin
    steps:
      - uses: actions/checkout@v4

      # Виявлено на git.7n.ai (2026-08-16): різні прогони підхоплюють різні варіанти
      # self-hosted runner-образу з несумісними дефектами — одні без curl, одні без
      # writable $HOME, і невідомо заздалегідь, чи є sudo (є не на всіх). $SUDO —
      # порожній рядок, якщо sudo відсутній (тоді job явно вже виконується як root).
      - name: Detect sudo availability
        run: echo "SUDO=$(command -v sudo || true)" >> "$GITHUB_ENV"

      - name: Ensure curl (self-hosted runner image lacks it)
        run: command -v curl || ($SUDO apt-get update -qq && $SUDO apt-get install -y -qq curl)

      # $GITHUB_WORKSPACE гарантовано writable (checkout уже туди пише) — переносимо
      # $HOME туди замість боротьби з правами оригінального $HOME (яке на одному з
      # варіантів образу непривілейоване й без sudo для виправлення). На tauri-образі
      # rustup вже преінстальований у /opt/rustup (root-only) — RUSTUP_HOME/CARGO_HOME
      # теж переносимо в workspace, інакше "could not create temp file
      # /opt/rustup/tmp/...: Permission denied" (спостережено 2026-08-16).
      - name: Use writable HOME/RUSTUP_HOME/CARGO_HOME for rustup
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.home"
          echo "HOME=$GITHUB_WORKSPACE/.home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$GITHUB_WORKSPACE/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          # cargo-xwin лінкує через rust-lld (частина llvm-tools) замість
          # системного linker — потрібен окремий rustup-компонент лише для msvc-ноги.
          components: ${{ matrix.builder == 'xwin' && 'llvm-tools' || '' }}

      # apt виявився непрацездатним і на tauri-образі ("Permission denied" на
      # /var/lib/apt/lists, той самий дефект, що на інших варіантах — 2026-08-16).
      # Власний zig-wrapper (пряме "zig cc" як CC/linker) наштовхнувся на
      # ld.lld duplicate-symbol _start/_init/_fini (rust-side self-contained
      # crt-обʼєкти проти zig-ового musl-сисрута), а rustc-фікс через
      # "-C link-self-contained=-crto" виявився unstable-опцією на stable-каналі
      # ("only y/yes/on/n/no/off/-linker are stable", спостережено 2026-08-16).
      # cargo-zigbuild — призначений саме для цього сценарію (Rust + zig-cc +
      # musl/apple), сам знає правильні лінкер-прапори — надійніше за власний
      # wrapper. Автозавантаження zig у ньому не спрацювало на цьому образі
      # ("Failed to find zig", спостережено 2026-08-16) — довантажуємо zig самі
      # (curl+tar, python3-lzma фолбек) й кладемо на PATH.
      - name: Install cargo-zigbuild (no apt/root needed)
        if: matrix.builder == 'zigbuild'
        run: cargo install cargo-zigbuild --locked

      - name: Install zig (cargo-zigbuild couldn't auto-download it here)
        if: matrix.builder == 'zigbuild'
        run: |
          ZIG_DIR="$GITHUB_WORKSPACE/.zig"
          mkdir -p "$ZIG_DIR" /tmp/zig-extract
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          if ! tar -xf /tmp/zig.tar.xz -C /tmp/zig-extract --strip-components=1 2>/dev/null; then
            python3 - <<'PYEOF'
          import lzma, os, shutil, tarfile

          with lzma.open("/tmp/zig.tar.xz") as f, tarfile.open(fileobj=f) as tar:
              top = tar.getnames()[0].split("/")[0]
              tar.extractall("/tmp/zig-raw")
          for name in os.listdir(os.path.join("/tmp/zig-raw", top)):
              shutil.move(os.path.join("/tmp/zig-raw", top, name), "/tmp/zig-extract")
          PYEOF
          fi
          cp -r /tmp/zig-extract/. "$ZIG_DIR/"
          echo "$ZIG_DIR" >> "$GITHUB_PATH"

      # cargo-xwin сам довантажує офіційний MS SDK/CRT (через "xwin", легально —
      # на відміну від Apple SDK) при першому запуску, кешує в CARGO_HOME.
      - name: Install cargo-xwin (no apt/root needed)
        if: matrix.builder == 'xwin'
        run: cargo install cargo-xwin --locked

      # "zig cc --driver-mode=cl" виявився глухим кутом: zig-овий "cc" завжди
      # інжектить власні hardening-прапори (-fstack-protector-strong, --param
      # ssp-buffer-size=4 тощо) ДО обробки driver-mode, а clang-cl-парсер
      # (MSVC-стиль) не розуміє ці GNU-прапори — "error: no such file or
      # directory: 'ssp-buffer-size=4'" (відтворено локально 2026-08-17,
      # структурний баг Zig, не наш wrapper). cc-rs шукає компілятор рівно на
      # імʼя "clang-cl" в PATH — довантажуємо СПРАВЖНІЙ LLVM-реліз (легально,
      # на відміну від Apple SDK) замість емуляції через Zig.
      - name: Install real LLVM (clang-cl/lld-link — Zig-emulation is structurally broken for cl-mode)
        if: matrix.builder == 'xwin'
        run: |
          LLVM_DIR="$GITHUB_WORKSPACE/.llvm"
          mkdir -p "$LLVM_DIR" /tmp/llvm-extract
          curl -fsSL -o /tmp/llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.0/LLVM-19.1.0-Linux-X64.tar.xz
          if ! tar -xf /tmp/llvm.tar.xz -C /tmp/llvm-extract --strip-components=1 2>/dev/null; then
            python3 - <<'PYEOF'
          import lzma, os, shutil, tarfile

          with lzma.open("/tmp/llvm.tar.xz") as f, tarfile.open(fileobj=f) as tar:
              top = tar.getnames()[0].split("/")[0]
              tar.extractall("/tmp/llvm-raw")
          for name in os.listdir(os.path.join("/tmp/llvm-raw", top)):
              shutil.move(os.path.join("/tmp/llvm-raw", top, name), "/tmp/llvm-extract")
          PYEOF
          fi
          cp -r /tmp/llvm-extract/. "$LLVM_DIR/"
          echo "$LLVM_DIR/bin" >> "$GITHUB_PATH"

      - name: Build (cargo-zigbuild — musl/Apple)
        if: matrix.builder == 'zigbuild'
        run: cargo zigbuild --release --target ${{ matrix.target }} --bin g

      - name: Build (cargo-xwin — Windows MSVC)
        if: matrix.builder == 'xwin'
        run: cargo xwin build --release --target ${{ matrix.target }} --bin g

      - name: Stage binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      # v4+ (@actions/artifact v2+ протокол) не підтримується на Forgejo/GHES-сумісних
      # runner'ах ("GHESNotSupportedError", спостережено 2026-08-16, ПІСЛЯ успішного
      # білду — це вже не build-помилка). v3 сумісний.
      - uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          path: dist

      # download-artifact@v3 без "name" кладе кожен матричний артефакт у власну
      # підтеку dist/<asset>/<asset> — збираємо всі 4 в один плаский release/.
      - name: Flatten artifact layout
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;

      # Forgejo не має власного `gh`-аналога, преінстальованого на runners — реліз і
      # asset-upload через REST API (Gitea-сумісний, той самий у Forgejo). NB:
      # ${{ vars.FJ_API_URL }} має вказувати на https://git.7n.ai/api/v1 — виставлено
      # як repo variable (назва без префікса FORGEJO_ — той зарезервований платформою,
      # POST .../actions/variables/FORGEJO_API_URL повертає "invalid secret name",
      # перевірено 2026-08-16).
      # Ідемпотентно: реліз для цього тегу міг уже існувати (напр. GitHub-side
      # macOS-workflow встиг створити його першим — обидва тригеряться тим
      # самим tag push, порядок не гарантований).
      - name: Create Forgejo Release + upload assets
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ vars.FJ_API_URL }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # jq відсутній на цьому runner-образі ("command not found", спостережено
          # 2026-08-16) — відповідь плоска ({"id":N,...}), витягуємо без jq.
          existing=$(curl -fsS "$API/repos/$REPO/releases/tags/$TAG" \
            -H "Authorization: token $TOKEN" 2>/dev/null | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*' || true)
          if [ -n "$existing" ]; then
            release_id="$existing"
          else
            release_id=$(curl -fsS -X POST "$API/repos/$REPO/releases" \
              -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')
          fi
          for f in release/*; do
            curl -fsS -X POST "$API/repos/$REPO/releases/$release_id/assets?name=$(basename "$f")" \
              -H "Authorization: token $TOKEN" -F "attachment=@$f"
          done

  update-homebrew-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          path: dist

      - name: Compute version and checksum
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "sha_linux_x64=$(sha256sum dist/g-x86_64-unknown-linux-musl/g-x86_64-unknown-linux-musl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout 7n/homebrew
        uses: actions/checkout@v4
        with:
          repository: 7n/homebrew
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          path: tap

      # Патчить ЛИШЕ секцію on_linux за BEGIN_LINUX/END_LINUX-маркерами, не
      # чіпаючи on_macos — той пише окремий GitHub Actions workflow
      # (nitra-public/7n-g, macos-14), незалежно й у довільному порядку щодо
      # цього job. Якщо файл ще не існує (перший реліз), створюємо skeleton
      # з обома секціями як odie-заглушки. Чистий sed/awk, без python3 —
      # частина варіантів self-hosted "ubuntu-latest"-образу його не мають
      # ("python3: command not found", спостережено 2026-08-18).
      - name: Update formula (on_linux section only)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA_LINUX: ${{ steps.meta.outputs.sha_linux_x64 }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          FORMULA="tap/Formula/g.rb"

          if [ ! -f "$FORMULA" ]; then
            mkdir -p "$(dirname "$FORMULA")"
            cat > "$FORMULA" <<'RUBYEOF'
          class G < Formula
            desc "g CLI — git-дельта інструмент @7n/n (скорочено від git; репо git.7n.ai/7n/g)"
            homepage "https://git.7n.ai/7n/g"
            version "0.0.0"
            license "ISC"

            # BEGIN_MACOS
            on_macos do
              odie "g: macOS build not yet published for this version"
            end
            # END_MACOS

            # BEGIN_LINUX
            on_linux do
              odie "g: Linux build not yet published for this version"
            end
            # END_LINUX

            test do
              system "#{bin}/g", "--help"
            end
          end
          RUBYEOF
          fi

          sed -i.bak "s/version \"[^\"]*\"/version \"${VERSION}\"/" "$FORMULA" && rm -f "$FORMULA.bak"

          awk -v tag="$TAG" -v sha="$SHA_LINUX" '
            /# BEGIN_LINUX/ {
              print "  # BEGIN_LINUX"
              print "  on_linux do"
              print "    url \"https://git.7n.ai/7n/g/releases/download/" tag "/g-x86_64-unknown-linux-musl\""
              print "    sha256 \"" sha "\""
              print ""
              print "    def install"
              print "      bin.install \"g-x86_64-unknown-linux-musl\" => \"g\""
              print "    end"
              print "  end"
              print "  # END_LINUX"
              skip=1
              next
            }
            /# END_LINUX/ { skip=0; next }
            skip { next }
            { print }
          ' "$FORMULA" > "$FORMULA.tmp" && mv "$FORMULA.tmp" "$FORMULA"

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@git.7n.ai"
          git add Formula/g.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "g ${{ steps.meta.outputs.version }}"
          git push
