name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional exact semantic version, without v"
        required: false
        type: string

concurrency:
  # A main push may supersede an older preparation run, but must never cancel a tag release.
  group: g-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release-pr:
    # Never push a release commit to protected main. Prepare it in a PR instead.
    if: "${{ github.ref_type == 'branch' && github.ref_name == 'main' && !contains(github.event.head_commit.message, 'chore(release): v') }}"
    runs-on: macos-arm64
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: current-version
        name: Read workspace version
        shell: sh
        run: |
          set -eu
          version="$(awk -F '"' '/^version = "[0-9]+\.[0-9]+\.[0-9]+"$/ { print $2; exit }' Cargo.toml)"
          test -n "${version}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
      - id: oidc
        uses: nitra/actions/oidc-token@v1
        with:
          audience: u:3:0a002276-48e3-4717-a189-199fe947cce3
      - id: release-version
        uses: nitra/actions/conventional-release-version@v1
        with:
          current-version: ${{ steps.current-version.outputs.version }}
          requested-version: ${{ inputs.version }}
          tag-prefix: v
      - if: steps.release-version.outputs.release == 'true' && steps.current-version.outputs.version != steps.release-version.outputs.version
        name: Update g workspace version
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          set -eu
          perl -0pi -e 's/^version = "[0-9]+\.[0-9]+\.[0-9]+"$/q{version = "} . $ENV{VERSION} . q{"}/me' Cargo.toml
          perl -0pi -e 's/(name = "n7n-g"\nversion = ")[^"]+/$1$ENV{VERSION}/g' Cargo.lock
      - if: steps.release-version.outputs.release == 'true'
        uses: nitra/actions/forgejo-create-release-pr@v1
        with:
          token: ${{ steps.oidc.outputs.token }}
          server-url: https://git.7n.ai
          repository: 7n/g
          tag: ${{ steps.release-version.outputs.tag }}
          paths: |
            Cargo.toml
            Cargo.lock
          base: main
          commit-message: "chore(release): ${{ steps.release-version.outputs.tag }}"

  tag-release:
    # A merged release PR has the version commit on protected main; only the tag is pushed.
    if: "${{ github.ref_type == 'branch' && github.ref_name == 'main' && contains(github.event.head_commit.message, 'chore(release): v') }}"
    runs-on: macos-arm64
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: oidc
        uses: nitra/actions/oidc-token@v1
        with:
          audience: u:3:0a002276-48e3-4717-a189-199fe947cce3
      - id: tag
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version = "[0-9]+\.[0-9]+\.[0-9]+"$/ { print $2; exit }' Cargo.toml)"
          printf 'value=v%s\n' "${version}" >> "${GITHUB_OUTPUT}"
      - uses: nitra/actions/forgejo-tag-and-dispatch@v1
        with:
          token: ${{ steps.oidc.outputs.token }}
          server-url: https://git.7n.ai
          repository: 7n/g
          tag: ${{ steps.tag.outputs.value }}
          workflow: release.yml
          expected-commit-message: "chore(release): ${{ steps.tag.outputs.value }}"

  validate:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: macos-arm64
    steps:
      - uses: actions/checkout@v7
      - name: Validate workspace and registry package
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version = "[0-9]+\.[0-9]+\.[0-9]+"$/ { print $2; exit }' Cargo.toml)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          # Full lint and test coverage is required from CI / validate before merge.
          cargo fmt --check
          cargo test --locked

  create-release:
    needs: validate
    runs-on: macos-arm64
    enable-openid-connect: true
    outputs:
      id: ${{ steps.release.outputs.release-id }}
    steps:
      - id: oidc
        uses: nitra/actions/oidc-token@v1
        with:
          audience: u:3:0a002276-48e3-4717-a189-199fe947cce3
      - id: release
        uses: nitra/actions/forgejo-create-draft-release@v1
        with:
          token: ${{ steps.oidc.outputs.token }}
          server-url: https://git.7n.ai
          repository: 7n/g
          tag: ${{ github.ref_name }}

  build-macos-arm64:
    needs: create-release
    runs-on: macos-arm64
    env:
      RUSTC_WRAPPER: /opt/homebrew/bin/sccache
      SCCACHE_DIR: /Users/m1-grey/Library/Caches/g/sccache
      SCCACHE_CACHE_SIZE: 20G
      RUSTUP_TOOLCHAIN: 1.93.0
    steps:
      - uses: actions/checkout@v7
      - name: Configure persistent Rust target directory
        shell: bash
        run: |
          set -euo pipefail
          target_dir="/Users/m1-grey/Library/Caches/g/cargo-target/1.93.0"
          mkdir -p "${target_dir}"
          printf 'CARGO_TARGET_DIR=%s\n' "${target_dir}" >> "${GITHUB_ENV}"
      - name: Build macOS asset
        run: |
          set -euo pipefail
          cargo +1.93.0 zigbuild -p n7n-g --release --locked --target aarch64-apple-darwin
      - name: Archive signed macOS asset
        run: |
          set -euo pipefail
          mkdir -p release-assets
          tar -C "${CARGO_TARGET_DIR}/aarch64-apple-darwin/release" -czf release-assets/g-aarch64-apple-darwin.tar.gz g
      - uses: https://code.forgejo.org/actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: release-assets

  build-linux-x86_64:
    needs: create-release
    runs-on: macos-arm64
    env: { RUSTC_WRAPPER: /opt/homebrew/bin/sccache, SCCACHE_DIR: /Users/m1-grey/Library/Caches/g/sccache, SCCACHE_CACHE_SIZE: 20G, RUSTUP_TOOLCHAIN: 1.93.0 }
    steps:
      - uses: actions/checkout@v7
      - uses: nitra/actions/rust-zigbuild-archive@v1
        with: { package: n7n-g, binary: g, target: x86_64-unknown-linux-gnu, target-directory: /Users/m1-grey/Library/Caches/g/cargo-target/1.93.0, archive-path: release-assets/g-x86_64-unknown-linux-gnu.tar.gz, sccache-directory: /Users/m1-grey/Library/Caches/g/sccache }
      - uses: https://code.forgejo.org/actions/upload-artifact@v4
        with: { name: release-linux-x86_64, path: release-assets }

  build-linux-arm64:
    needs: create-release
    runs-on: macos-arm64
    env: { RUSTC_WRAPPER: /opt/homebrew/bin/sccache, SCCACHE_DIR: /Users/m1-grey/Library/Caches/g/sccache, SCCACHE_CACHE_SIZE: 20G, RUSTUP_TOOLCHAIN: 1.93.0 }
    steps:
      - uses: actions/checkout@v7
      - uses: nitra/actions/rust-zigbuild-archive@v1
        with: { package: n7n-g, binary: g, target: aarch64-unknown-linux-gnu, target-directory: /Users/m1-grey/Library/Caches/g/cargo-target/1.93.0, archive-path: release-assets/g-aarch64-unknown-linux-gnu.tar.gz, sccache-directory: /Users/m1-grey/Library/Caches/g/sccache }
      - uses: https://code.forgejo.org/actions/upload-artifact@v4
        with: { name: release-linux-arm64, path: release-assets }

  build-windows-x86_64:
    needs: create-release
    runs-on: macos-arm64
    env: { RUSTC_WRAPPER: /opt/homebrew/bin/sccache, SCCACHE_DIR: /Users/m1-grey/Library/Caches/g/sccache, SCCACHE_CACHE_SIZE: 20G, RUSTUP_TOOLCHAIN: 1.93.0 }
    steps:
      - uses: actions/checkout@v7
      - uses: nitra/actions/rust-zigbuild-archive@v1
        with: { package: n7n-g, binary: g, target: x86_64-pc-windows-gnu, target-directory: /Users/m1-grey/Library/Caches/g/cargo-target/1.93.0, archive-path: release-assets/g-x86_64-pc-windows-gnu.zip, archive-format: zip, sccache-directory: /Users/m1-grey/Library/Caches/g/sccache }
      - uses: https://code.forgejo.org/actions/upload-artifact@v4
        with: { name: release-windows-x86_64, path: release-assets }

  collect_and_publish:
    needs: [create-release, build-macos-arm64, build-linux-x86_64, build-linux-arm64, build-windows-x86_64]
    runs-on: macos-arm64
    enable-openid-connect: true
    outputs:
      homebrew_url: ${{ steps.homebrew.outputs.url }}
      homebrew_macos_sha256: ${{ steps.checks.outputs.macos_sha256 }}
      homebrew_linux_x86_64_sha256: ${{ steps.checks.outputs.linux_x86_64_sha256 }}
      homebrew_linux_arm64_sha256: ${{ steps.checks.outputs.linux_arm64_sha256 }}
    steps:
      - uses: https://code.forgejo.org/actions/download-artifact@v4
        with: { pattern: release-*, path: release-assets, merge-multiple: true }
      - uses: nitra/actions/release-manifest@v1
        with:
          output-directory: release-assets
          title: g ${{ github.ref_name }}
          files: |
            release-assets/g-aarch64-apple-darwin.tar.gz
            release-assets/g-x86_64-unknown-linux-gnu.tar.gz
            release-assets/g-aarch64-unknown-linux-gnu.tar.gz
            release-assets/g-x86_64-pc-windows-gnu.zip
      - id: oidc
        uses: nitra/actions/oidc-token@v1
        with: { audience: u:3:0a002276-48e3-4717-a189-199fe947cce3 }
      - uses: nitra/actions/forgejo-upload-release-assets@v1
        with:
          token: ${{ steps.oidc.outputs.token }}
          server-url: https://git.7n.ai
          repository: 7n/g
          release-id: ${{ needs.create-release.outputs.id }}
          files: |
            release-assets/g-aarch64-apple-darwin.tar.gz
            release-assets/g-x86_64-unknown-linux-gnu.tar.gz
            release-assets/g-aarch64-unknown-linux-gnu.tar.gz
            release-assets/g-x86_64-pc-windows-gnu.zip
            release-assets/SHA256SUMS
            release-assets/MANIFEST.txt
      - id: checks
        run: |
          set -eu; cd release-assets; mac=g-aarch64-apple-darwin.tar.gz; x64=g-x86_64-unknown-linux-gnu.tar.gz; arm=g-aarch64-unknown-linux-gnu.tar.gz
          mac_sha="$(shasum -a 256 "$mac"|awk '{print $1}')"; x64_sha="$(shasum -a 256 "$x64"|awk '{print $1}')"; arm_sha="$(shasum -a 256 "$arm"|awk '{print $1}')"; printf 'macos_sha256=%s\nlinux_x86_64_sha256=%s\nlinux_arm64_sha256=%s\n' "$mac_sha" "$x64_sha" "$arm_sha" >> "$GITHUB_OUTPUT"
      - id: homebrew
        uses: nitra/actions/artifact-publish-release-assets@v1
        with:
          project: g-release
          files: |
            release-assets/g-aarch64-apple-darwin.tar.gz
            release-assets/g-x86_64-unknown-linux-gnu.tar.gz
            release-assets/g-aarch64-unknown-linux-gnu.tar.gz


  update-homebrew:
    needs: collect_and_publish
    runs-on: macos-arm64
    enable-openid-connect: true
    steps:
      - id: oidc
        uses: nitra/actions/oidc-token@v1
        with:
          audience: u:3:0a002276-48e3-4717-a189-199fe947cce3
      - id: formula_version
        run: printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
      - uses: nitra/actions/homebrew-write-formula@v1
        with:
          token: ${{ steps.oidc.outputs.token }}
          tap-url: https://git.7n.ai/7n/homebrew.git
          formula-name: g
          class-name: g
          description: g CLI - git delta tool
          homepage: https://git.7n.ai/7n/g
          license: MIT
          version: ${{ steps.formula_version.outputs.version }}
          binary: g
          macos-url: ${{ needs.collect_and_publish.outputs.homebrew_url }}/g-aarch64-apple-darwin.tar.gz
          macos-sha256: ${{ needs.collect_and_publish.outputs.homebrew_macos_sha256 }}
          linux-x86-64-url: ${{ needs.collect_and_publish.outputs.homebrew_url }}/g-x86_64-unknown-linux-gnu.tar.gz
          linux-x86-64-sha256: ${{ needs.collect_and_publish.outputs.homebrew_linux_x86_64_sha256 }}
          linux-arm64-url: ${{ needs.collect_and_publish.outputs.homebrew_url }}/g-aarch64-unknown-linux-gnu.tar.gz
          linux-arm64-sha256: ${{ needs.collect_and_publish.outputs.homebrew_linux_arm64_sha256 }}

  publish-release:
    needs: update-homebrew
    runs-on: macos-arm64
    enable-openid-connect: true
    steps:
      - id: oidc
        uses: nitra/actions/oidc-token@v1
        with:
          audience: u:3:0a002276-48e3-4717-a189-199fe947cce3
      - uses: nitra/actions/forgejo-publish-release@v1
        with:
          token: ${{ steps.oidc.outputs.token }}
          server-url: https://git.7n.ai
          repository: 7n/g
          tag: ${{ github.ref_name }}
