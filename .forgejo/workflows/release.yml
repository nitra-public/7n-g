name: Release g

# Патерн перенесено з mt-rust/.github/workflows/release-mt.yml (ADR 20260814-195911):
# build matrix → Forgejo Release (замість GitHub Release) → оновлення Homebrew tap
# 7n/homebrew. Прапор cargo-binstall pkg-url у Cargo.toml очікує саме такі asset-імена
# (g-<target>) — бінарник називається `g` (скорочено від git), package/crate — n7n-g.
#
# Лише x86_64-unknown-linux-musl наразі: self-hosted Forgejo runner на git.7n.ai не має
# зареєстрованого macOS-раннера (перевірено 2026-08-16), а cross-compile на macOS з
# Linux потребує osxcross + витягнутий Apple SDK (ліцензійно не дистриб'юється
# відкрито) — не робимо це наспіх. aarch64-apple-darwin — окрема задача, коли зʼявиться
# або реальний Mac-раннер, або належно підготовлений osxcross-образ.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Виявлено на git.7n.ai (2026-08-16): різні прогони підхоплюють різні варіанти
      # self-hosted runner-образу з несумісними дефектами — одні без curl, одні без
      # writable $HOME, і невідомо заздалегідь, чи є sudo (є не на всіх). $SUDO —
      # порожній рядок, якщо sudo відсутній (тоді job явно вже виконується як root).
      - name: Detect sudo availability
        run: echo "SUDO=$(command -v sudo || true)" >> "$GITHUB_ENV"

      - name: Ensure curl (self-hosted runner image lacks it)
        run: command -v curl || ($SUDO apt-get update -qq && $SUDO apt-get install -y -qq curl)

      # $GITHUB_WORKSPACE гарантовано writable (checkout уже туди пише) — переносимо
      # $HOME туди замість боротьби з правами оригінального $HOME (яке на одному з
      # варіантів образу непривілейоване й без sudo для виправлення).
      - name: Use a writable HOME for rustup
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.home"
          echo "HOME=$GITHUB_WORKSPACE/.home" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # apt-get на цьому варіанті runner-образу не працює НАВІТЬ на update (non-root,
      # без sudo, "Permission denied" на /var/lib/apt/lists) — системний musl-gcc
      # недосяжний. cargo-zigbuild несе власний cross-лінкер (Zig), без apt/root —
      # той самий патерн, що мт-rust/.github/workflows/release-mt.yml. Розпаковуємо
      # .tar.xz через python3 stdlib (lzma+tarfile) — системного бінарника `xz` теж
      # немає на цьому образі ("tar (child): xz: Cannot exec: No such file or
      # directory", спостережено 2026-08-16).
      - name: Install zig (self-contained C toolchain — no apt/root/xz needed)
        run: |
          ZIG_DIR="$GITHUB_WORKSPACE/.zig"
          mkdir -p "$ZIG_DIR"
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          python3 - "$ZIG_DIR" <<'PYEOF'
          import lzma, os, shutil, sys, tarfile

          dest = sys.argv[1]
          extract_dir = "/tmp/zig-extract"
          with lzma.open("/tmp/zig.tar.xz") as f, tarfile.open(fileobj=f) as tar:
              top = tar.getnames()[0].split("/")[0]
              tar.extractall(extract_dir)
          src = os.path.join(extract_dir, top)
          for name in os.listdir(src):
              shutil.move(os.path.join(src, name), dest)
          PYEOF
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          printf '#!/bin/sh\nexec "%s/zig" cc "$@"\n' "$ZIG_DIR" > "$ZIG_DIR/cc"
          chmod +x "$ZIG_DIR/cc"
          echo "CC=$ZIG_DIR/cc" >> "$GITHUB_ENV"

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Build
        run: cargo zigbuild --release --target x86_64-unknown-linux-musl --bin g

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/g dist/g-x86_64-unknown-linux-musl
          chmod +x dist/g-x86_64-unknown-linux-musl

      - uses: actions/upload-artifact@v4
        with:
          name: g-x86_64-unknown-linux-musl
          path: dist/g-x86_64-unknown-linux-musl
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact layout
        run: |
          mkdir -p release
          cp dist/g-x86_64-unknown-linux-musl/g-x86_64-unknown-linux-musl release/

      # Forgejo не має власного `gh`-аналога, преінстальованого на runners — реліз і
      # asset-upload через REST API (Gitea-сумісний, той самий у Forgejo). NB:
      # ${{ vars.FJ_API_URL }} має вказувати на https://git.7n.ai/api/v1 — виставлено
      # як repo variable (назва без префікса FORGEJO_ — той зарезервований платформою,
      # POST .../actions/variables/FORGEJO_API_URL повертає "invalid secret name",
      # перевірено 2026-08-16).
      - name: Create Forgejo Release + upload assets
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ vars.FJ_API_URL }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_id=$(curl -fsS -X POST "$API/repos/$REPO/releases" \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}" | jq -r .id)
          for f in release/*; do
            curl -fsS -X POST "$API/repos/$REPO/releases/$release_id/assets?name=$(basename "$f")" \
              -H "Authorization: token $TOKEN" -F "attachment=@$f"
          done

  update-homebrew-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Compute version and checksum
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "sha_linux_x64=$(sha256sum dist/g-x86_64-unknown-linux-musl/g-x86_64-unknown-linux-musl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout 7n/homebrew
        uses: actions/checkout@v4
        with:
          repository: 7n/homebrew
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          path: tap

      - name: Update formula
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA_LINUX: ${{ steps.meta.outputs.sha_linux_x64 }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > tap/Formula/g.rb <<EOF
          class G < Formula
            desc "g CLI — git-дельта інструмент @7n/n (скорочено від git; репо git.7n.ai/7n/g)"
            homepage "https://git.7n.ai/7n/g"
            version "${VERSION}"
            license "ISC"

            on_macos do
              odie "g: macOS-збірка ще не публікується (немає macOS-раннера в CI) — постав через 'cargo install n7n-g' або 'cargo binstall n7n-g' з локальною компіляцією."
            end

            on_linux do
              url "https://git.7n.ai/7n/g/releases/download/${TAG}/g-x86_64-unknown-linux-musl"
              sha256 "${SHA_LINUX}"

              def install
                bin.install "g-x86_64-unknown-linux-musl" => "g"
              end
            end

            test do
              system "#{bin}/g", "--help"
            end
          end
          EOF

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@git.7n.ai"
          git add Formula/g.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "g ${{ steps.meta.outputs.version }}"
          git push
